[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dj-skills"
version = "0.1.0"
description = "A tiny reusable Django app: per-user Skills."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Bruce Stull" }]
dependencies = ["Django>=4.2"]

[project.urls]
Homepage = "https://github.com/brucestull/dj-skills"

[tool.hatch.build.targets.wheel]
packages = ["src/dj_skills"]
